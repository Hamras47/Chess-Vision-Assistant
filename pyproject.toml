[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-vision-assistant-v16"
version = "1.6.0"
dependencies = ["PySide6>=6.6", "python-chess>=1.999", "numpy>=1.26", "opencv-python>=4.9", "mss>=9.0", "openai>=1.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["app", "app.*"]
exclude = ["tests*"]
namespaces = false
[tool.pytest.ini_options]
pythonpath = ["."]
